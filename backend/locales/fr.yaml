    title: "Partie II : Relations statistiques"
    intro: "Cette section présente les relations statistiquement étayées entre les questions. Ce sont les options de réponse, les items et les thèmes qui sont testés, et non des questions entières. Les valeurs p sont corrigées pour le nombre de tests (Benjamini-Hochberg). Une relation n'est pas une cause. La « lecture possible » est une interprétation, pas un résultat."
