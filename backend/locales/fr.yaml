# Fixed texts for reports and exports (fr).
# Keys are shared by all catalogs; en.yaml is the reference and fallback.
report:
  segment_by: "Par {dimension}"
  group_differences:
    title: "Partie III : Différences entre les groupes"
    intro: "Cette section présente des différences statistiquement étayées entre les groupes des segmentations configurées. Sont testés des options de réponse, des items et des thèmes de questions ouvertes pris un à un, et non des questions entières. Tous les tests d'une question forment une famille ; leurs valeurs p sont corrigées pour le nombre de tests (Benjamini-Hochberg). Sont retenues les différences à partir d'une taille d'effet faible et, pour les parts, à partir d'un écart de {points} points de pourcentage entre les groupes. Une différence entre groupes n'est pas une cause. La « lecture possible » est une interprétation, pas un résultat."
    by: "Selon {dimension}"
    small_only: "Les différences significatives selon {dimension} sont toutes inférieures à {points} points de pourcentage."
    none: "Aucune question ne présente de différences statistiquement significatives entre les groupes."
    summary: "Synthèse"
  segment_comparison:
    title: "Partie IV : Thèmes par groupe selon {dimension}"
    intro: "Cette section regroupe les réponses aux questions ouvertes séparément pour chaque groupe selon {dimension}. Les thèmes et les parts décrivent chaque groupe pour lui-même ; comme chaque groupe a ses propres thèmes, ils ne sont pas testés et ne sont pas directement comparables. Les différences testées entre les groupes figurent dans la section « Différences entre les groupes ». Les parts se rapportent aux répondants du groupe ayant répondu (n)."
    group: "{group} (n = {n})"
    topic: "{name} : {share} %"
  distribution:
    title: "Répartition par {dimension}"
    count: "Nombre"
    share: "Part"
  segment_themes:
    part_title: "Partie 2 : Thèmes par {dimension}"
    question_title: "Thèmes par {dimension}"
    mentions: "{n} mentions"
summary:
  segments_not_testable: "Les effectifs sont insuffisants pour des comparaisons selon {dimensions}."
  no_significant_differences: "Aucune différence statistiquement significative n'apparaît selon {dimensions}."
