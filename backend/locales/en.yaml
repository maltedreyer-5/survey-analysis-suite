# Fixed texts for reports and exports (en).
# Keys are shared by all catalogs; en.yaml is the reference and fallback.
report:
  segment_by: "By {dimension}"
  group_differences:
    title: "Part III: Differences between groups"
    intro: "This section shows statistically supported differences between the groups of the configured segmentations. Individual answer options, items and topics of free-text questions are tested, not whole questions. All tests of a question form one family; their p values are adjusted for the number of tests (Benjamini-Hochberg). Listed are differences from a weak effect size on and, for shares, from a gap of {points} percentage points between the groups. A difference between groups is not a cause. The \"possible reading\" is an interpretation, not a finding."
    by: "By {dimension}"
    small_only: "The significant differences by {dimension} are all below {points} percentage points."
    none: "No question shows statistically significant differences between the groups."
    summary: "Summary"
  segment_comparison:
    title: "Part IV: Topics per group by {dimension}"
    intro: "This section clusters the free-text responses separately for each group by {dimension}. The topics and shares describe each group on its own; since every group has its own topics, they are not tested and not directly comparable. Tested differences between the groups are in the section \"Differences between groups\". Shares refer to the respondents of the group who answered (n)."
    group: "{group} (n = {n})"
    topic: "{name}: {share} %"
  distribution:
    title: "Distribution by {dimension}"
    count: "Count"
    share: "Share"
  segment_themes:
    part_title: "Part 2: Themes by {dimension}"
    question_title: "Themes by {dimension}"
    mentions: "{n} mentions"
summary:
  segments_not_testable: "There are too few cases for comparisons by {dimensions}."
  no_significant_differences: "There are no statistically significant differences by {dimensions}."
clustering:
  part_of: "Part of: {description}"
  all_responses: "All responses"
  failed: "Automatic clustering failed"
  other_mentions: "Other mentions"
  auto_assigned: "Automatically assigned responses"
analysis:
  not_ranked: "not ranked"
  binary:
    "yes": "yes"
    "no": "no"
  strength:
    negligible: "negligible"
    weak: "weak"
    medium: "medium"
    strong: "strong"
  effect_measure:
    cramers_v: "Cramér's V"
    kendall_tau_b: "Kendall's τ-b"
    epsilon_squared: "ε²"
  test:
    chi2: "chi-square test"
    fisher: "Fisher's exact test"
    kendall_tau_b: "Kendall rank correlation"
    kruskal_wallis: "Kruskal-Wallis test"
  measure:
    rank_position: "rank, 1 = first"
    scale_index: "mean over all items"
    cluster_mentioned: "topic mentioned"
  fact:
    stats: "{test}: {measure} = {effect} ({strength}), adjusted p (q) = {q}, n = {n}"
    cell: "Group \"{a}\" (n = {group_n}): \"{b}\" at {share}% (overall {overall}%)"
    direction_positive: "The higher \"{a}\", the higher \"{b}\" tends to be."
    direction_negative: "The higher \"{a}\", the lower \"{b}\" tends to be."
    median: "Median of \"{num}\" in the group \"{group}\": {median} (overall {overall}; n = {group_n})"
    group_shares: "Share \"{variable}\" per group: {values}"
    group_share: "{group} {share}% (n = {n})"
  reading: "Possible reading"
correlations:
  general: "General associations"
  cross_theme: "Cross-theme associations"
  report:
    title: "Part II: Statistical associations"
    intro: "This section shows statistically supported associations between questions. Single answer options, items and topics are tested, not whole questions. The p values are adjusted for the number of tests (Benjamini-Hochberg). An association is not a cause. The \"possible reading\" is an interpretation, not a finding."
    questions: "Associated questions:"
    strongest: "Strongest associations"
    summary: "Summary"
    themes: "Themes"
chart:
  mean_on_scale: "Mean on the scale"
  no_data: "No data"
  weighted_points: "Weighted points"
  axis:
    pct_resp: "% of respondents"
    pct_yes: "% yes"
    points: "points"
    freq: "Frequency"
    pct: "%"
  base: "n = {n}"
  base_mc: "n = {n} respondents with at least one selection; multiple selections possible"
  base_yes: "n = {n} respondents; share of \"{positive}\" per item"
  excluded: "Without \"{values}\" ({count} answers, grey bar); shares relate to the remaining answers per item."
  excluded_bar: "not on the scale"
  ranking: "Points: rank 1 = {k} points … rank {k} = 1 point; n = {n} respondents with a ranking."
  medians: "Median per group; line: middle 50% (quartiles). Groups: {dimension}."
  neutral_split: "half left, half right"
handler:
  date:
    summary: "{n} dates between {first} and {last}; median {median}; most dates in {peak}."
    axis_count: "Count"
  numeric_matrix:
    top: "\"{item}\" has the highest mean ({mean}; n = {n})."
    axis_mean: "Mean"
  single_choice:
    top: "The most common answer was \"{answer}\" with {count} mentions ({pct:.1f}%)."
  multi_choice:
    top: "The most frequently chosen options were: {items}."
    item: "\"{label}\" ({count}, {pct:.0f}%)"
  multi_choice_binary:
    top: "The most frequently mentioned item was \"{item}\" ({count} mentions, {pct:.0f}%)."
  ranking:
    table_headers: ["Rank", "Item", "Score", "Avg. Rank", "Share"]
    score_label: "Weighted Score"
    top: "The highest priorities were assigned to: {items}."
    score_explanation: "The weighted score is calculated from the ranking: Rank 1 receives {n} points, Rank 2 receives {n_minus_1} points, down to Rank {n} with 1 point. The higher the score, the higher the priority assigned by respondents."
  matrix_likert:
    top: "The highest proportion of \"{scale}\" was recorded for \"{item}\" at {pct:.0f}%."
  freetext:
    items: "Total {n_items} mentions from {n_responses} persons. These were grouped into {n_clusters} thematic clusters."
    single_cluster: "The {n} free-text responses relate to the topic \"{cluster}\", though with varying approaches."
    clusters: "The {n} free-text responses were grouped into {n_clusters} clusters. The largest cluster \"{cluster}\" contains {count} mentions ({pct:.0f}%)."
    chart_items: "Total {n_items} mentions from {n_responses} persons. Percentages = share of persons (multiple mentions possible)."
  cooperation_matrix:
    top: "The most important cooperation partner is \"{partner}\" (importance score: {score:.2f}). {pct:.0f}% rate this partner as significant or central."
    axis_percent: "Percentage"
    axis_share: "Share {values}"
