# Fixed texts for reports and exports (it).
# Keys are shared by all catalogs; en.yaml is the reference and fallback.
report:
  segment_by: "Per {dimension}"
  group_differences:
    title: "Parte III: Differenze tra gruppi"
    intro: "Questa sezione mostra differenze statisticamente supportate tra i gruppi delle segmentazioni configurate. Vengono testate singole opzioni di risposta, item e temi delle domande aperte, non domande intere. Tutti i test di una domanda formano una famiglia; i loro valori p sono corretti per il numero di test (Benjamini-Hochberg). Sono riportate le differenze a partire da un effetto debole e, per le quote, da una distanza di {points} punti percentuali tra i gruppi. Una differenza tra gruppi non è una causa. La «possibile lettura» è un'interpretazione, non un risultato."
    by: "Per {dimension}"
    small_only: "Le differenze significative per {dimension} sono tutte inferiori a {points} punti percentuali."
    none: "Nessuna domanda mostra differenze statisticamente significative tra i gruppi."
    summary: "Sintesi"
  segment_comparison:
    title: "Parte IV: Temi per gruppo per {dimension}"
    intro: "Questa sezione raggruppa le risposte aperte separatamente per ciascun gruppo per {dimension}. I temi e le quote descrivono ciascun gruppo a sé; poiché ogni gruppo ha temi propri, non sono testati e non sono direttamente confrontabili. Le differenze testate tra i gruppi si trovano nella sezione «Differenze tra gruppi». Le quote si riferiscono ai rispondenti del gruppo che hanno risposto (n)."
    group: "{group} (n = {n})"
    topic: "{name}: {share} %"
  distribution:
    title: "Distribuzione per {dimension}"
    count: "Numero"
    share: "Quota"
  segment_themes:
    part_title: "Parte 2: Temi per {dimension}"
    question_title: "Temi per {dimension}"
    mentions: "{n} menzioni"
summary:
  segments_not_testable: "I casi non sono sufficienti per confronti per {dimensions}."
  no_significant_differences: "Non emergono differenze statisticamente significative per {dimensions}."
