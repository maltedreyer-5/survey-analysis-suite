# Fixed texts for reports and exports (de).
# Keys are shared by all catalogs; en.yaml is the reference and fallback.
report:
  segment_by: "Nach {dimension}"
  group_differences:
    title: "Teil III: Unterschiede zwischen Gruppen"
    intro: "Dieser Abschnitt zeigt statistisch abgesicherte Unterschiede zwischen den Gruppen der konfigurierten Segmentierungen. Getestet werden einzelne Antwortoptionen, Items und Themen der Freitextfragen, nicht ganze Fragen. Alle Tests einer Frage bilden eine Familie; ihre p-Werte sind für die Zahl der Tests korrigiert (Benjamini-Hochberg). Aufgeführt sind Unterschiede ab schwacher Effektstärke und, bei Anteilen, ab {points} Prozentpunkten Abstand zwischen den Gruppen. Ein Unterschied zwischen Gruppen ist keine Ursache. Die „mögliche Lesart“ ist eine Deutung, kein Befund."
    by: "Nach {dimension}"
    small_only: "Die signifikanten Unterschiede nach {dimension} liegen alle unter {points} Prozentpunkten."
    none: "Keine Frage zeigt statistisch signifikante Unterschiede zwischen den Gruppen."
    summary: "Zusammenfassung"
  segment_comparison:
    title: "Teil IV: Themen je Gruppe nach {dimension}"
    intro: "In diesem Abschnitt werden die Freitext-Antworten je Gruppe nach {dimension} gesondert geclustert. Die Themen und Anteile beschreiben jede Gruppe für sich; da jede Gruppe eigene Themen hat, sind sie nicht getestet und nicht direkt vergleichbar. Getestete Unterschiede zwischen den Gruppen stehen im Abschnitt „Unterschiede zwischen Gruppen“. Die Anteile beziehen sich auf die Befragten der Gruppe mit Antwort (n)."
    group: "{group} (n = {n})"
    topic: "{name}: {share} %"
  distribution:
    title: "Verteilung nach {dimension}"
    count: "Anzahl"
    share: "Anteil"
  segment_themes:
    part_title: "Teil 2: Themen nach {dimension}"
    question_title: "Themen nach {dimension}"
    mentions: "{n} Nennungen"
summary:
  segments_not_testable: "Für Vergleiche nach {dimensions} reichen die Fallzahlen nicht aus."
  no_significant_differences: "Nach {dimensions} zeigen sich keine statistisch signifikanten Unterschiede."
