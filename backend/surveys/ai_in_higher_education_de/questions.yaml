      - den Datenschutz
      - die Schulungsangebote
    scale: quality
    id: rating
    type: matrix_likert
  priorities:
    handler: ranking
    label:
      de: Was ist Ihnen beim Einsatz von KI am wichtigsten? (Rang 1 bis 3)
    columns:
    - rank_0
    - rank_1
    - rank_2
    item_labels:
      de:
      - Datenschutz
      - Kosten
      - Qualität der Ergebnisse
      - Einfache Bedienung
    id: priorities
    type: ranking
  budget:
    handler: numeric_matrix
    label:
      de: Wie sollte die Hochschule ein KI-Budget von 100 Punkten verteilen?
    columns:
    - budget_0
    - budget_1
    - budget_2
    item_labels:
      de:
      - Lehre
      - Forschung
      - Verwaltung
    constant_sum: 100
    id: budget
    type: numeric_matrix
  last_training:
    handler: date
    label:
      de: Wann haben Sie zuletzt eine KI-Schulung besucht?
    columns:
    - visit
    id: last_training
    type: date
  improve:
    handler: freetext
    label:
      de: Was sollte die Hochschule beim Einsatz von KI vor allem verbessern?
    columns:
    - improve
    id: improve
    type: freetext
  reasons:
    handler: freetext
    label:
      de: Nennen Sie bis zu drei Gründe, warum Sie KI-Werkzeuge nutzen oder nicht nutzen.
    columns:
    - reason_0
    - reason_1
    - reason_2
    id: reasons
    type: freetext
