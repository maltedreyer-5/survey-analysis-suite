    columns:
    - used_0
    - used_1
    - used_2
    - used_3
    - used_4
    item_labels:
      de:
      - Chatbots (z. B. für Texte)
      - Übersetzung
      - Programmierhilfe
      - Bildgenerierung
      - Sonstiges
    binary_values:
      positive: Ja
      negative: Nein
    id: tools_used
    type: multi_choice_binary
  tools_used_other:
    handler: freetext
    label:
      de: Welche KI-Werkzeuge haben Sie im letzten Semester genutzt? – Sonstiges
    columns:
    - used_other
    other_of: tools_used
    id: tools_used_other
    type: freetext
  rating:
    handler: matrix_likert
    label:
      de: Wie bewerten Sie …
    columns:
