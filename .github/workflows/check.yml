#
# Runs exactly the checks that CONTRIBUTING.md defines as "checked" (scripts/check.sh),
# including the check that no runtime state is in the repository.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -r backend/requirements.txt pytest
      - name: Check
        run: bash scripts/check.sh
